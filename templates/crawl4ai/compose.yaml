name: crawl4ai

x-arcane:
  icon: https://crawl4ai.com/favicon.ico
  urls:
    - https://github.com/unclecode/crawl4AI
    - https://docs.crawl4ai.com
    - https://crawl4ai.com

services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    # Chromium needs shared memory; the upstream file uses the same setting.
    shm_size: "1gb"
    # Hardening carried over from the upstream compose file.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    deploy:
      resources:
        limits:
          memory: 4G
          # PID cap; expressed here (not as pids_limit) so the file stays valid
          # on Compose v5+, which rejects pids_limit alongside a limits block.
          pids: 512
        reservations:
          memory: 1G
    user: "appuser"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN}
      CRAWL4AI_ALLOW_DEEP_CRAWL: ${CRAWL4AI_ALLOW_DEEP_CRAWL:-false}
      CRAWL4AI_EXECUTE_JS_ENABLED: ${CRAWL4AI_EXECUTE_JS_ENABLED:-false}
      CRAWL4AI_HOOKS_ENABLED: ${CRAWL4AI_HOOKS_ENABLED:-false}
      CRAWL4AI_UPSTREAM_PROXY: ${CRAWL4AI_UPSTREAM_PROXY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GEMINI_API_TOKEN: ${GEMINI_API_TOKEN:-}
    ports:
      - "${PORT:-11235}:11235"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      com.getarcaneapp.arcane.icon: https://crawl4ai.com/favicon.ico
