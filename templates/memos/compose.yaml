name: memos

x-arcane:
  icon: https://github.com/MemTensor.png
  urls:
    - https://github.com/MemTensor/MemOS
    - https://memos-docs.openmem.net/
    - https://memos-docs.openmem.net/open_source/getting_started/installation/

services:
  memos:
    image: ghcr.io/heretek-ai/memos:latest
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PYTHONPATH: /app/src
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DB_NAME: ${NEO4J_DB_NAME:-neo4j}
      NEO4J_BACKEND: ${NEO4J_BACKEND:-neo4j-community}
      MOS_CHAT_MODEL: ${MOS_CHAT_MODEL:-gpt-4o-mini}
      MOS_CHAT_MODEL_PROVIDER: ${MOS_CHAT_MODEL_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      MEMRADER_MODEL: ${MEMRADER_MODEL:-gpt-4o-mini}
      MEMRADER_API_KEY: ${MEMRADER_API_KEY:-}
      MEMRADER_API_BASE: ${MEMRADER_API_BASE:-}
      MEMRADER_MAX_TOKENS: ${MEMRADER_MAX_TOKENS:-5000}
      MOS_EMBEDDER_MODEL: ${MOS_EMBEDDER_MODEL:-text-embedding-3-small}
      MOS_EMBEDDER_BACKEND: ${MOS_EMBEDDER_BACKEND:-universal_api}
      MOS_EMBEDDER_API_BASE: ${MOS_EMBEDDER_API_BASE:-}
      MOS_EMBEDDER_API_KEY: ${MOS_EMBEDDER_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      MOS_RERANKER_BACKEND: ${MOS_RERANKER_BACKEND:-cosine_local}
      ENABLE_CHAT_API: ${ENABLE_CHAT_API:-true}
      MEMSCHEDULER_USE_REDIS_QUEUE: "false"
      MOS_CUBE_PATH: /data/cubes
      MEMOS_BASE_PATH: /data
    volumes:
      - memos-data:/data
    labels:
      com.getarcaneapp.arcane.icon: https://github.com/MemTensor.png

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/neo4j.svg

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/qdrant.svg

volumes:
  memos-data:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
